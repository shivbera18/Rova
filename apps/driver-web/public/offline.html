<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Offline - Chalo-X Driver</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 380px;
        padding: 32px 26px;
        background: #fff;
        border: 2px solid #0f172a;
        border-radius: 12px;
        box-shadow: 4px 4px 0 #0f172a;
      }
      h1 { font-size: 20px; margin: 12px 0 8px; }
      p { font-size: 13.5px; color: #475569; line-height: 1.5; margin: 0 0 18px; }
      button {
        padding: 10px 22px;
        font-weight: 800;
        font-size: 14px;
        color: #fff;
        background: #4f46e5;
        border: 2px solid #0f172a;
        border-radius: 8px;
        box-shadow: 2px 2px 0 #0f172a;
        cursor: pointer;
      }
      .dot { width: 44px; height: 44px; margin: 0 auto; border-radius: 50%; border: 4px solid #4f46e5; display: grid; place-items: center; font-size: 20px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">âš </div>
      <h1>You're offline</h1>
      <p>
        Chalo-X needs a connection to go online and receive ride offers in real time.
        Your booked trip screen will reconnect automatically once you're back online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
