services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chalo
      POSTGRES_PASSWORD: chalo
      POSTGRES_DB: chalox
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chalo"]
      interval: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 15
volumes:
  pgdata:
